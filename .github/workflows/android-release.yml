name: Build and release APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/TVBrowser-android-tv.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/TVBrowser-android-tv-debug.apk

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tvbrowser-apk
          path: out/*.apk

      - name: Publish "latest" release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TV Video Browser (latest build)
          body: |
            Build automatically compiled from commit ${{ github.sha }}.

            **Instalação (Xiaomi Mi Box / qualquer Android TV):**
            1. Baixe `TVBrowser-android-tv.apk` neste release.
            2. Instale um app tipo "Downloader" ou "Send Files to TV" na sua TV Box (ou ative "Fontes desconhecidas" e copie o APK via pendrive/ADB).
            3. Abra o APK baixado na TV Box e confirme a instalação.
          files: |
            out/TVBrowser-android-tv.apk
            out/TVBrowser-android-tv-debug.apk
          make_latest: true
          prerelease: false
